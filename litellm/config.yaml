# LiteLLM proxy config — the bought/embedded data plane.
# Local mock routes support credential-free tests; managed DeepSeek routes use the real upstream.
# Clients select via the "model" field in the /v1/messages request body.

model_list:
  # ── Phase-0 spike target: local OpenAI-compatible mock, no real key ──
  - model_name: glm-mock
    litellm_params:
      model: deepseek/glm-mock
      # host/uvx: http://localhost:8899/v1 ; in Docker: http://host.docker.internal:8899/v1
      api_base: os.environ/HARA_MOCK_BASE
      api_key: mock-not-a-real-key
      # The OpenAI-compatible wire accepts DeepSeek's native thinking controls. LiteLLM's
      # generic OpenAI transform does not advertise them, so opt them into transparent relay.
      allowed_openai_params: [thinking, reasoning_effort]
    # Synthetic non-zero prices make the local budget/spend E2E exercise real metering behavior.
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
  - model_name: glm-mock-pro
    litellm_params:
      model: deepseek/glm-mock-pro
      api_base: os.environ/HARA_MOCK_BASE
      api_key: mock-not-a-real-key
      allowed_openai_params: [thinking, reasoning_effort]
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001

  # ── Real upstream: DeepSeek (regular pay-as-you-go key in UPSTREAM_API_KEY; NOT a coding-plan sk-sp key) ──
  # OpenAI-compatible at https://api.deepseek.com/chat/completions (Bearer). New Hara keys expose
  # DeepSeek's canonical V4 ids. The two old Hara aliases remain registered below only so already-
  # issued device keys and profiles keep working; new enrollment canonicalizes them before issue.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/UPSTREAM_API_KEY
      allowed_openai_params: [thinking, reasoning_effort]
    # DeepSeek V4 official peak USD/token pricing, checked 2026-08-21. LiteLLM has no time-of-day
    # tariff switch, so budgets deliberately use the conservative peak rate instead of undercounting.
    model_info:
      input_cost_per_token: 0.00000044
      output_cost_per_token: 0.00000132
      cache_read_input_token_cost: 0.000000014
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_base: https://api.deepseek.com
      api_key: os.environ/UPSTREAM_API_KEY
      allowed_openai_params: [thinking, reasoning_effort]
    model_info:
      input_cost_per_token: 0.00000132
      output_cost_per_token: 0.00000396
      cache_read_input_token_cost: 0.000000044
  - model_name: deepseek-v4-flash-vision-exp
    litellm_params:
      # LiteLLM 1.92.0's native DeepSeek chat transform still assumes DeepSeek accepts text-only
      # messages and flattens every content array to a string. That silently discards image_url
      # blocks. The official endpoint is OpenAI-compatible, so use the generic adapter for this
      # one visual route to preserve its multimodal message verbatim.
      model: openai/deepseek-v4-flash-vision-exp
      api_base: https://api.deepseek.com
      api_key: os.environ/UPSTREAM_API_KEY
      allowed_openai_params: [thinking, reasoning_effort]
    model_info:
      input_cost_per_token: 0.00000044
      output_cost_per_token: 0.00000132
      cache_read_input_token_cost: 0.000000014

  # Compatibility aliases — never advertise these for newly issued keys.
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/UPSTREAM_API_KEY
      allowed_openai_params: [thinking, reasoning_effort]
    model_info:
      input_cost_per_token: 0.00000044
      output_cost_per_token: 0.00000132
      cache_read_input_token_cost: 0.000000014
  - model_name: deepseek-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_base: https://api.deepseek.com
      api_key: os.environ/UPSTREAM_API_KEY
      allowed_openai_params: [thinking, reasoning_effort]
    model_info:
      input_cost_per_token: 0.00000132
      output_cost_per_token: 0.00000396
      cache_read_input_token_cost: 0.000000044

litellm_settings:
  drop_params: true
  # Route Anthropic /v1/messages through OpenAI /chat/completions, NOT the Responses API.
  # Required: OpenAI-compatible upstreams (DashScope/Qwen/GLM compatible-mode) only expose
  # /chat/completions, not /v1/responses. Without this, /v1/messages 404s against them.
  use_chat_completions_url_for_anthropic_messages: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
